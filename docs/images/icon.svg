<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="樱夜 AniSakura 应用图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20102a"/>
      <stop offset="0.55" stop-color="#120d1c"/>
      <stop offset="1" stop-color="#08060e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff5f92" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff5f92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc2d6"/>
      <stop offset="0.45" stop-color="#ff5f92"/>
      <stop offset="1" stop-color="#b8336a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9f2"/>
      <stop offset="1" stop-color="#ff9dbe"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 单瓣：从中心向外的一片花瓣 -->
    <path id="p" d="M0 0 C 20 -30, 26 -68, 0 -104 C -26 -68, -20 -30, 0 0 Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#bloom)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 五瓣樱花 -->
  <g transform="translate(256 250)" filter="url(#softGlow)">
    <g>
      <use href="#p" fill="url(#petal)" opacity="0.95" transform="rotate(0) scale(0.94)"/>
      <use href="#p" fill="url(#petal)" opacity="0.95" transform="rotate(72) scale(0.94)"/>
      <use href="#p" fill="url(#petal)" opacity="0.95" transform="rotate(144) scale(0.94)"/>
      <use href="#p" fill="url(#petal)" opacity="0.95" transform="rotate(216) scale(0.94)"/>
      <use href="#p" fill="url(#petal)" opacity="0.95" transform="rotate(288) scale(0.94)"/>
    </g>
    <!-- 花心 -->
    <circle r="26" fill="#2a1330" opacity="0.5"/>
    <circle r="21" fill="url(#core)" opacity="0.96"/>
    <!-- 播放三角 -->
    <path d="M -9 -13 L 14 0 L -9 13 Z" fill="#2a1330" opacity="0.88"/>
  </g>

  <!-- 零散花瓣点 -->
  <g fill="#ff8fb4" opacity="0.45">
    <circle cx="112" cy="118" r="6"/>
    <circle cx="408" cy="136" r="4.5"/>
    <circle cx="94" cy="398" r="4"/>
    <circle cx="424" cy="380" r="6"/>
  </g>
  <g fill="#6ee7f5" opacity="0.3">
    <circle cx="146" cy="262" r="3"/>
    <circle cx="368" cy="256" r="3"/>
  </g>
</svg>
