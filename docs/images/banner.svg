<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="樱夜 AniSakura — 红果短剧二次元皮肤">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset="0.55" stop-color="#110c1b"/>
      <stop offset="1" stop-color="#0b0812"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#ff5f92" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff5f92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="1" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.82" cy="1" r="0.55">
      <stop offset="0" stop-color="#6ee7f5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6ee7f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffd7e6"/>
      <stop offset="1" stop-color="#9de9f7"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f92"/>
      <stop offset="0.5" stop-color="#ff86b6"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2350"/>
      <stop offset="1" stop-color="#221436"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a4e"/>
      <stop offset="1" stop-color="#161e33"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glowPink)"/>
  <rect width="1280" height="420" fill="url(#glowViolet)"/>
  <rect width="1280" height="420" fill="url(#glowCyan)"/>

  <!-- 樱花散落 -->
  <g fill="#ff8fb4" opacity="0.55">
    <circle cx="118" cy="86" r="4"/>
    <circle cx="214" cy="326" r="3"/>
    <circle cx="352" cy="64" r="5"/>
    <circle cx="470" cy="356" r="3.5"/>
    <circle cx="596" cy="92" r="4"/>
    <circle cx="690" cy="300" r="3"/>
    <circle cx="806" cy="58" r="4.5"/>
    <circle cx="980" cy="352" r="3.5"/>
    <circle cx="1128" cy="120" r="4"/>
    <circle cx="1236" cy="286" r="3"/>
  </g>
  <g fill="#6ee7f5" opacity="0.4">
    <circle cx="268" cy="146" r="2.5"/>
    <circle cx="518" cy="212" r="2.5"/>
    <circle cx="742" cy="188" r="2.5"/>
    <circle cx="1052" cy="232" r="2.5"/>
  </g>

  <!-- 左侧文字区 -->
  <g>
    <rect x="72" y="112" width="4" height="34" rx="2" fill="url(#pill)"/>
    <text x="94" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b6a8c9" letter-spacing="3">RED FRUIT DRAMA · WEBVIEW SKIN</text>

    <text x="70" y="238" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="92" font-weight="900" fill="url(#title)" letter-spacing="-3">樱夜</text>
    <text x="318" y="238" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffd7e6" letter-spacing="1" opacity="0.92">AniSakura</text>

    <text x="72" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#b6a8c9">
      红果短剧 · 二次元皮肤层 —— 只换视觉，不动播放内核
    </text>

    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">
      <rect x="72" y="322" width="128" height="36" rx="18" fill="#ff5f92" opacity="0.18" stroke="#ff5f92" stroke-opacity="0.5"/>
      <text x="94" y="346" fill="#ffd0e0">1.65 MB</text>

      <rect x="212" y="322" width="150" height="36" rx="18" fill="#6ee7f5" opacity="0.14" stroke="#6ee7f5" stroke-opacity="0.42"/>
      <text x="234" y="346" fill="#bff4fb">Android 8.0+</text>

      <rect x="374" y="322" width="132" height="36" rx="18" fill="#b06bff" opacity="0.16" stroke="#b06bff" stroke-opacity="0.45"/>
      <text x="396" y="346" fill="#dfc8ff">GPL-3.0</text>
    </g>
  </g>

  <!-- 右侧手机示意 -->
  <g transform="translate(880 26)">
    <rect x="0" y="0" width="248" height="368" rx="34" fill="#0a0810" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="10" y="10" width="228" height="348" rx="26" fill="#12101c"/>

    <!-- 顶栏 -->
    <rect x="10" y="10" width="228" height="42" rx="26" fill="#ff5f92" opacity="0.10"/>
    <rect x="26" y="22" width="20" height="20" rx="6" fill="url(#pill)"/>
    <text x="54" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#f6effc">红果短剧</text>

    <!-- 分类胶囊 -->
    <rect x="22" y="64" width="58" height="24" rx="12" fill="url(#pill)"/>
    <text x="32" y="80" font-family="PingFang SC, sans-serif" font-size="11" fill="#ffffff">推荐</text>
    <rect x="88" y="64" width="52" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="98" y="80" font-family="PingFang SC, sans-serif" font-size="11" fill="#b6a8c9">都市</text>
    <rect x="148" y="64" width="52" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="158" y="80" font-family="PingFang SC, sans-serif" font-size="11" fill="#b6a8c9">言情</text>

    <!-- 海报 3 列 2 行 -->
    <g>
      <rect x="22" y="100" width="64" height="86" rx="12" fill="url(#posterA)" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="22" y="164" width="64" height="22" rx="11" fill="#1e1226" fill-opacity="0.75"/>
      <text x="30" y="179" font-family="PingFang SC, sans-serif" font-size="8" fill="#ffd0e0">全集</text>

      <rect x="94" y="100" width="64" height="86" rx="12" fill="url(#posterB)" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="94" y="164" width="52" height="22" rx="11" fill="#1e1226" fill-opacity="0.75"/>
      <text x="102" y="179" font-family="PingFang SC, sans-serif" font-size="8" fill="#bff4fb">更新</text>

      <rect x="166" y="100" width="64" height="86" rx="12" fill="#2b1a3d" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="166" y="164" width="58" height="22" rx="11" fill="#1e1226" fill-opacity="0.75"/>
      <text x="174" y="179" font-family="PingFang SC, sans-serif" font-size="8" fill="#ffd0e0">独播</text>

      <rect x="22" y="196" width="64" height="9" rx="4" fill="#f6effc" fill-opacity="0.82"/>
      <rect x="22" y="210" width="46" height="7" rx="3" fill="#807191" fill-opacity="0.7"/>

      <rect x="94" y="196" width="60" height="9" rx="4" fill="#f6effc" fill-opacity="0.82"/>
      <rect x="94" y="210" width="40" height="7" rx="3" fill="#807191" fill-opacity="0.7"/>

      <rect x="166" y="196" width="56" height="9" rx="4" fill="#f6effc" fill-opacity="0.82"/>
      <rect x="166" y="210" width="44" height="7" rx="3" fill="#807191" fill-opacity="0.7"/>
    </g>

    <!-- 选集示意 -->
    <g>
      <rect x="22" y="230" width="30" height="28" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#f6effc">01</text>
      <rect x="56" y="230" width="30" height="28" rx="9" fill="url(#pill)"/>
      <text x="64" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">02</text>
      <rect x="90" y="230" width="30" height="28" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="98" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#f6effc">03</text>
      <rect x="124" y="230" width="30" height="28" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="132" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#f6effc">04</text>
      <rect x="158" y="230" width="30" height="28" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="166" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#f6effc">05</text>
      <rect x="192" y="230" width="30" height="28" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="200" y="249" font-family="Arial" font-size="12" font-weight="700" fill="#f6effc">06</text>
    </g>

    <!-- 播放大按钮 -->
    <rect x="22" y="272" width="204" height="40" rx="20" fill="url(#pill)" opacity="0.95"/>
    <path d="M104 286 L124 292 L104 298 Z" fill="#ffffff"/>
    <text x="134" y="298" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">开始播放</text>

    <!-- 底栏 -->
    <rect x="10" y="322" width="228" height="36" rx="20" fill="#0f0b18" fill-opacity="0.9"/>
    <g>
      <rect x="30" y="330" width="34" height="20" rx="8" fill="#ff5f92" fill-opacity="0.22"/>
      <circle cx="47" cy="336" r="3" fill="#ff5f92"/>
      <rect x="40" y="342" width="14" height="3" rx="1.5" fill="#ff5f92" fill-opacity="0.8"/>

      <circle cx="105" cy="338" r="3.5" fill="#807191"/>
      <circle cx="160" cy="338" r="3.5" fill="#807191"/>
      <circle cx="205" cy="338" r="3.5" fill="#807191"/>
    </g>
  </g>
</svg>
